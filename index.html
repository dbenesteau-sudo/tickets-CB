<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Notes de frais</title>
<link rel="apple-touch-icon" href="icon.PNG">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Notes de frais">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#FAF7F0;
    --ink:#1C1B19;
    --ink-soft:#5B564C;
    --green:#2F5D50;
    --green-dark:#20423A;
    --rule:#DAD3C4;
    --red:#B3432E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--rule);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  header .brand{
    font-family:Georgia, "Times New Roman", serif;
    font-size:20px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  header .date{
    font-family:"SF Mono", "Courier New", monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:24px 20px 32px;
  }
  /* --- Écran 1 : capture --- */
  .stage{display:none; flex:1; flex-direction:column;}
  .stage.active{display:flex;}

  #stage-capture{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:28px;
  }
  #stage-capture .hint{
    color:var(--ink-soft);
    font-size:15px;
    max-width:280px;
    line-height:1.5;
  }
  .shutter{
    width:104px;
    height:104px;
    border-radius:50%;
    background:var(--green);
    border:4px solid var(--paper);
    box-shadow:0 0 0 3px var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .shutter:active{transform:scale(0.93);}
  .shutter svg{width:40px; height:40px;}

  /* --- Écran 2 : vérification --- */
  #stage-review{gap:16px;}
  .receipt-frame{
    flex:1;
    border:1px solid var(--rule);
    background:#fff;
    border-radius:2px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
  }
  .receipt-frame img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
  }
  .review-question{
    text-align:center;
    font-size:15px;
    color:var(--ink-soft);
    margin:2px 0 4px;
  }
  .yesno{
    display:flex;
    gap:12px;
  }
  .yesno button{
    flex:1;
    padding:16px 0;
    font-size:17px;
    font-weight:600;
    border-radius:10px;
    border:none;
    cursor:pointer;
  }
  #btn-non{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink-soft);
  }
  #btn-oui{
    background:var(--green);
    color:var(--paper);
  }

  /* --- Écran 3 : envoi --- */
  #stage-send{gap:18px; align-items:stretch;}
  .field{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    background:#fff;
    border:1px solid var(--rule);
    border-radius:10px;
    font-family:"SF Mono","Courier New",monospace;
    font-size:15px;
  }
  .field .label{color:var(--ink-soft); font-family:-apple-system,sans-serif; font-size:13px;}
  .field .value{font-weight:600; letter-spacing:0.5px;}
  .send-btn{
    margin-top:auto;
    padding:18px 0;
    border-radius:10px;
    border:none;
    background:var(--green);
    color:var(--paper);
    font-size:17px;
    font-weight:600;
    cursor:pointer;
  }
  .send-btn:disabled{opacity:0.5;}
  .back-link{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:8px 0 0;
    cursor:pointer;
  }

  /* --- Écran 4 : confirmation --- */
  #stage-done{
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:16px;
  }
  .check{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .check svg{width:30px; height:30px;}
  #stage-done .filename{
    font-family:"SF Mono","Courier New",monospace;
    font-size:15px;
    color:var(--ink-soft);
  }
  .new-btn{
    margin-top:20px;
    padding:14px 28px;
    border-radius:10px;
    border:1px solid var(--rule);
    background:transparent;
    color:var(--ink);
    font-size:15px;
    cursor:pointer;
  }

  .error-box{
    background:#F7E9E5;
    color:var(--red);
    border:1px solid #E3B7A9;
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;
  }
  .spinner{
    width:18px; height:18px;
    border:2px solid rgba(250,247,240,0.4);
    border-top-color:var(--paper);
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:inline-block;
    vertical-align:-3px;
    margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  input[type=file]{display:none;}
</style>
</head>
<body>

<header>
  <div class="brand">Notes de frais</div>
  <div class="date" id="header-date">--/--</div>
</header>

<main>

  <!-- Écran 1 : capture -->
  <section id="stage-capture" class="stage active">
    <div class="shutter" id="btn-shoot">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FAF7F0" stroke-width="1.8">
        <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/>
        <circle cx="12" cy="13" r="3.5"/>
      </svg>
    </div>
    <div class="hint">Photographiez votre ticket. Il sera converti en PDF et envoyé à la comptabilité.</div>
    <input type="file" id="file-input" accept="image/*" capture="environment">
  </section>

  <!-- Écran 2 : vérification -->
  <section id="stage-review" class="stage">
    <div class="receipt-frame">
      <img id="preview-img" src="" alt="Ticket photographié">
    </div>
    <div class="review-question">Le ticket est-il net et lisible ?</div>
    <div class="yesno">
      <button id="btn-non">Non, reprendre</button>
      <button id="btn-oui">Oui, c'est bon</button>
    </div>
  </section>

  <!-- Écran 3 : envoi -->
  <section id="stage-send" class="stage">
    <div class="receipt-frame" style="flex:0 0 40%;">
      <img id="preview-img-2" src="" alt="Ticket photographié">
    </div>
    <div class="field">
      <span class="label">Fichier</span>
      <span class="value" id="filename-preview">--</span>
    </div>
    <div id="send-error"></div>
    <button class="send-btn" id="btn-send">Envoyer à la comptabilité</button>
    <div class="back-link" id="btn-back-review">← revoir la photo</div>
  </section>

  <!-- Écran 4 : confirmation -->
  <section id="stage-done" class="stage">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FAF7F0" stroke-width="2.5">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <div>Ticket envoyé</div>
    <div class="filename" id="done-filename">--</div>
    <button class="new-btn" id="btn-new">Nouveau ticket</button>
  </section>

</main>

<script>
// ====== CONFIGURATION — à compléter après le déploiement Apps Script ======
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbyDhf2KmDVqapVhtDANmIb0GwrN4ivyeLsdinAMEDWEr0TVI2Gz0QndsujmV7Qfxry6/exec",
  INITIALS: "DB"
};
// ============================================================================

const stages = {
  capture: document.getElementById('stage-capture'),
  review: document.getElementById('stage-review'),
  send: document.getElementById('stage-send'),
  done: document.getElementById('stage-done'),
};
function showStage(name){
  Object.values(stages).forEach(s => s.classList.remove('active'));
  stages[name].classList.add('active');
}

function todayDDMM(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return dd+mm;
}
document.getElementById('header-date').textContent = todayDDMM().slice(0,2)+'/'+todayDDMM().slice(2,4);

let currentImageDataUrl = null;
let currentPdfBase64 = null;

const fileInput = document.getElementById('file-input');
document.getElementById('btn-shoot').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    currentImageDataUrl = ev.target.result;
    document.getElementById('preview-img').src = currentImageDataUrl;
    document.getElementById('preview-img-2').src = currentImageDataUrl;
    showStage('review');
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

document.getElementById('btn-non').addEventListener('click', () => {
  showStage('capture');
  fileInput.click();
});

document.getElementById('btn-back-review').addEventListener('click', () => showStage('review'));

document.getElementById('btn-oui').addEventListener('click', async () => {
  document.getElementById('filename-preview').textContent = todayDDMM()+'-'+CONFIG.INITIALS+'-…';
  document.getElementById('send-error').innerHTML = '';
  showStage('send');
  currentPdfBase64 = await imageToPdfBase64(currentImageDataUrl);
});

async function imageToPdfBase64(dataUrl){
  const img = new Image();
  await new Promise(res => { img.onload = res; img.src = dataUrl; });

  // Rotation de 90° vers la droite pour corriger les photos iPhone
  const canvas = document.createElement('canvas');
  canvas.width = img.height;
  canvas.height = img.width;

  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.rotate(Math.PI / 2);
  ctx.drawImage(img, 0, 0);

  const correctedDataUrl = canvas.toDataURL('image/jpeg', 0.92);

  const { jsPDF } = window.jspdf;

  const isPortrait = canvas.height >= canvas.width;

  const pdf = new jsPDF({
    orientation: isPortrait ? 'portrait' : 'landscape',
    unit: 'mm',
    format: 'a4'
  });

  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const margin = 10;
  const maxW = pageW - margin*2;
  const maxH = pageH - margin*2;

  const ratio = Math.min(maxW/canvas.width, maxH/canvas.height);
  const w = canvas.width*ratio;
  const h = canvas.height*ratio;
  const x = (pageW-w)/2;
  const y = (pageH-h)/2;

  pdf.addImage(correctedDataUrl, 'JPEG', x, y, w, h);

  const blob = pdf.output('blob');

  return await new Promise((resolve) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.readAsDataURL(blob);
  });
}

document.getElementById('btn-send').addEventListener('click', async () => {
  const btn = document.getElementById('btn-send');
  const errorBox = document.getElementById('send-error');
  errorBox.innerHTML = '';

  if(!currentPdfBase64){
    currentPdfBase64 = await imageToPdfBase64(currentImageDataUrl);
  }
  if(CONFIG.APPS_SCRIPT_URL.indexOf('REMPLACER') === 0){
    errorBox.innerHTML = '<div class="error-box">Configuration manquante : ajoutez l\'URL Apps Script dans CONFIG.APPS_SCRIPT_URL</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Envoi en cours…';

  try{
    // mode 'no-cors' : Google Apps Script redirige en interne et le navigateur
    // refuse de lire cette réponse depuis une page hébergée ailleurs (GitHub Pages).
    // On envoie donc "à l'aveugle" : si fetch() ne lève pas d'erreur, l'envoi est parti.
    await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        pdfBase64: currentPdfBase64,
        initials: CONFIG.INITIALS
      })
    });
    document.getElementById('done-filename').textContent = 'Vérifiez dans le dossier Drive dans quelques secondes';
    showStage('done');
  } catch(err){
    errorBox.innerHTML = '<div class="error-box">Échec de l\'envoi. Vérifiez votre connexion et réessayez.<br>('+err.message+')</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Envoyer à la comptabilité';
  }
});

document.getElementById('btn-new').addEventListener('click', () => {
  currentImageDataUrl = null;
  currentPdfBase64 = null;
  document.getElementById('header-date').textContent = todayDDMM().slice(0,2)+'/'+todayDDMM().slice(2,4);
  showStage('capture');
});
</script>

</body>
</html>
